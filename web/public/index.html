<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B1120" />
  <title>SK Note Taker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234F46E5'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <!-- Mobile top bar -->
    <header class="topbar" id="topbar">
      <button class="icon-btn" id="menuToggle" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="brand-mark-wrap" id="topbarBrand"></div>
      <div style="width:38px"></div>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a class="brand" href="#/" id="brandLink"></a>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="searchInput" placeholder="Search meetings…" autocomplete="off" />
      </div>
      <nav class="folders" id="folderNav"></nav>
      <div class="sidebar-footer">
        <span class="dot"></span> Reading live store
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <!-- Main content -->
    <main class="main" id="main">
      <div id="view"></div>
    </main>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
